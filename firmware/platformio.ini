;
;   pio test -e native          host-side tests of the packet encoder against protocol/vectors.json
;   pio run -e xiao_esp32c3     firmware; scripts/merge.sh makes one flashable image

[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32 @ 6.12.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino @ 2.3.6
build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; How long a press is broadcast for (ms). Set from the Phase-0 latency measurements.
  -DTB_BURST_MS=10000
  ; Optional status LED (active high, through 1 kΩ). -1 for none.
  -DTB_LED_PIN=5

[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<packet.cpp>
build_flags = -std=c++17 -Wall -Wextra
