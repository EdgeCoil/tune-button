;
;   pio test -e native          host-side tests: packet encoder (protocol/vectors.json) and key gestures
;   pio run -e <env>            firmware; scripts/merge.sh <env> makes one flashable image
;
; Environments:
;   xiao_esp32c3        a hand-wired XIAO with two buttons (hardware/wiring.md)
;   xiao_esp32c3_1btn   the same with one button
;   xiao_board          the XIAO four-key board (hardware/pcb/xiao)
;   c3_board            the c3 and c3-jst boards (ESP32-C3-WROOM-02 on board)

[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32 @ 6.12.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino @ 2.3.6
build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; How long a press is broadcast for (ms). Set from the Phase-0 latency measurements.
  -DTB_BURST_MS=10000
  ; Optional status LED (active high, through 1 kΩ). -1 for none. The boards below set their own.
  -DTB_LED_PIN=5

; The one-button build (like on D1 only; hold it 5 s to pair): pio run -e xiao_esp32c3_1btn
[env:xiao_esp32c3_1btn]
extends = env:xiao_esp32c3
build_flags = ${env:xiao_esp32c3.build_flags} -DTB_BUTTONS=1

; The XIAO four-key board: K1-K4 on D1-D4, LED on D5 (GPIO7). Not built yet, so untested.
[env:xiao_board]
extends = env:xiao_esp32c3
build_flags = -DCORE_DEBUG_LEVEL=0 -DTB_BURST_MS=10000 -DTB_BOARD_XIAO

; The c3 and c3-jst boards: K1-K4 on GPIO3/4/5/0, LED on GPIO10, flashing over the native USB.
; Not built yet, so untested.
[env:c3_board]
extends = env:xiao_esp32c3
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags = -DCORE_DEBUG_LEVEL=0 -DTB_BURST_MS=10000 -DTB_BOARD_C3
  -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<packet.cpp> +<gesture.cpp>
build_flags = -std=c++17 -Wall -Wextra
