# Licensing by path (REUSE specification 3.x). Files with their own SPDX header follow the header.
version = 1

[[annotations]]
path = ["hardware/case/**", "hardware/pcb/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 edgecoil"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

[[annotations]]
path = ["README.md", "docs/**", "hardware/wiring.md", "hardware/pcb/README.md", "protocol/spec.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 edgecoil"
SPDX-License-Identifier = "CC-BY-4.0"

# Generated test vectors and build settings.
[[annotations]]
path = ["protocol/vectors.json", "firmware/test/test_packet/vectors.h", "android/gradle.properties"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 edgecoil"
SPDX-License-Identifier = "MIT"

# The Gradle wrapper, as distributed by Gradle.
[[annotations]]
path = ["android/gradle/wrapper/**", "android/gradlew", "android/gradlew.bat"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".gitignore", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 edgecoil"
SPDX-License-Identifier = "CC0-1.0"
